name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: file-crafter-test
          MYSQL_DATABASE: file_crafter_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfile-crafter-test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      FILE_CRAFTER_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=file_crafter_test
      FILE_CRAFTER_TEST_MYSQL_USER: root
      FILE_CRAFTER_TEST_MYSQL_PASSWORD: file-crafter-test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --fail-on-warning --fail-on-risky --fail-on-incomplete --fail-on-skipped --fail-on-deprecation --fail-on-notice

  php80-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: git ls-files -z '*.php' | xargs -0 -n1 php -l
